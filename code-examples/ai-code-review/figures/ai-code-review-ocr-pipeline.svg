<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="496" viewBox="0 0 1220 496">
<title>OCR 的任务编排与两层反馈循环</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563b8"/></marker></defs>
<rect width="1220" height="496" fill="#ffffff"/>
<g font-family="Heiti SC, Noto Sans CJK SC, sans-serif">
<rect x="20" y="160" width="1176" height="286" rx="16" fill="#f9fbff" stroke="#d7e1ee" stroke-width="2"/>
<rect x="20" y="20" width="190" height="86" rx="16" fill="#f8faff" stroke="#d7e1ee" stroke-width="2"/>
<text x="115" y="53" font-size="23" fill="#172b46" font-weight="600" text-anchor="middle">1 文件选择</text>
<text x="115" y="87" font-size="17" fill="#52647b" font-weight="400" text-anchor="middle">Git diff 与程序筛选</text>
<path d="M218 63 L234 63" fill="none" stroke="#2563b8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="242" y="20" width="190" height="86" rx="16" fill="#f8faff" stroke="#d7e1ee" stroke-width="2"/>
<text x="337" y="53" font-size="23" fill="#172b46" font-weight="600" text-anchor="middle">2 规则准备</text>
<text x="337" y="87" font-size="17" fill="#52647b" font-weight="400" text-anchor="middle">加载配置，组内再匹配</text>
<path d="M440 63 L456 63" fill="none" stroke="#2563b8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="464" y="20" width="190" height="86" rx="16" fill="#f8faff" stroke="#d7e1ee" stroke-width="2"/>
<text x="559" y="53" font-size="23" fill="#172b46" font-weight="600" text-anchor="middle">3 文件分组</text>
<text x="559" y="87" font-size="17" fill="#52647b" font-weight="400" text-anchor="middle">LLM 分组，程序兜底</text>
<path d="M662 63 L678 63" fill="none" stroke="#2563b8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="686" y="20" width="190" height="86" rx="16" fill="#f8faff" stroke="#d7e1ee" stroke-width="2"/>
<text x="781" y="53" font-size="23" fill="#172b46" font-weight="600" text-anchor="middle">4 任务调度</text>
<text x="781" y="87" font-size="17" fill="#52647b" font-weight="400" text-anchor="middle">并发、预算、独立上下文</text>
<rect x="936" y="20" width="240" height="86" rx="16" fill="#f3faf7" stroke="#c6dfd4" stroke-width="2"/>
<text x="1056" y="53" font-size="23" fill="#172b46" font-weight="600" text-anchor="middle">汇总报告</text>
<text x="1056" y="87" font-size="18" fill="#52647b" font-weight="400" text-anchor="middle">评论、失败与未审内容</text>
<text x="610" y="185" font-size="20" fill="#172b46" font-weight="600" text-anchor="middle">每组独立任务，可并发运行</text>
<path d="M781 106 V139 H120 V224" fill="none" stroke="#2563b8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="230" width="170" height="100" rx="16" fill="#ffffff" stroke="#d7e1ee" stroke-width="2"/>
<text x="120" y="268" font-size="24" fill="#172b46" font-weight="600" text-anchor="middle">可选计划</text>
<text x="120" y="306" font-size="18" fill="#52647b" font-weight="400" text-anchor="middle">仅生成调查计划</text>
<rect x="320" y="230" width="220" height="100" rx="16" fill="#ffffff" stroke="#d7e1ee" stroke-width="2"/>
<text x="430" y="263" font-size="24" fill="#172b46" font-weight="600" text-anchor="middle">5 LLM 调查</text>
<text x="430" y="291" font-size="18" fill="#52647b" font-weight="400" text-anchor="middle">代码、规则与已有发现</text>
<text x="430" y="316" font-size="18" fill="#52647b" font-weight="400" text-anchor="middle">决定下一步动作</text>
<rect x="610" y="230" width="240" height="100" rx="16" fill="#ffffff" stroke="#d7e1ee" stroke-width="2"/>
<text x="730" y="263" font-size="24" fill="#172b46" font-weight="600" text-anchor="middle">程序执行工具</text>
<text x="730" y="291" font-size="18" fill="#52647b" font-weight="400" text-anchor="middle">搜索 / 读取 / 提交评论</text>
<text x="730" y="316" font-size="18" fill="#52647b" font-weight="400" text-anchor="middle">返回结果，收集候选评论</text>
<rect x="920" y="230" width="250" height="100" rx="16" fill="#ffffff" stroke="#d7e1ee" stroke-width="2"/>
<text x="1045" y="263" font-size="24" fill="#172b46" font-weight="600" text-anchor="middle">6 评论处理</text>
<text x="1045" y="291" font-size="18" fill="#52647b" font-weight="400" text-anchor="middle">定位 / 条件重定位</text>
<text x="1045" y="316" font-size="18" fill="#52647b" font-weight="400" text-anchor="middle">依据 diff 过滤评论</text>
<path d="M213 280 L312 280" fill="none" stroke="#2563b8" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M548 280 L602 280" fill="none" stroke="#2563b8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="575" y="270" font-size="17" fill="#2563b8" font-weight="400" text-anchor="middle">请求</text>
<path d="M730 330 V368 H430 V336" fill="none" stroke="#2563b8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="580" y="360" font-size="18" fill="#2563b8" font-weight="400" text-anchor="middle">结果追加；必要时压缩</text>
<path d="M430 230 V212 H1045 V224" fill="none" stroke="#2563b8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="740" y="206" font-size="18" fill="#52647b" font-weight="400" text-anchor="middle">task_done / 受限停止</text>
<path d="M1045 330 V424 H284 V280 H314" fill="none" stroke="#2563b8" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
<text x="690" y="416" font-size="20" fill="#2563b8" font-weight="400" text-anchor="middle">有新发现且未达限额：开始下一轮</text>
<path d="M1170 280 H1204 V63 H1182" fill="none" stroke="#2563b8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="610" y="477" font-size="19" fill="#52647b" font-weight="400" text-anchor="middle">实线：同一会话的工具反馈；虚线：本轮过滤后的下一轮审查</text>
</g></svg>
