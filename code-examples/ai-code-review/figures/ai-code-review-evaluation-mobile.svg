<svg xmlns="http://www.w3.org/2000/svg" width="480" height="396" viewBox="0 0 480 396">
<title>文件覆盖度、调查覆盖度与 bug 检出率</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563b8"/></marker></defs>
<rect width="480" height="396" fill="#ffffff"/>
<g font-family="Heiti SC, Noto Sans CJK SC, sans-serif">
<rect x="16" y="12" width="448" height="98" rx="16" fill="#f8faff" stroke="#d7e1ee" stroke-width="2"/>
<text x="34" y="41" font-size="23" fill="#172b46" font-weight="600" text-anchor="start">文件覆盖度</text>
<text x="34" y="69" font-size="20" fill="#52647b" font-weight="400" text-anchor="start">文件有没有进入并完成任务</text>
<text x="34" y="95" font-size="19" fill="#2563b8" font-weight="400" text-anchor="start">可以对账</text>
<rect x="16" y="124" width="448" height="98" rx="16" fill="#f8faff" stroke="#d7e1ee" stroke-width="2"/>
<text x="34" y="153" font-size="23" fill="#172b46" font-weight="600" text-anchor="start">调查覆盖度</text>
<text x="34" y="181" font-size="20" fill="#52647b" font-weight="400" text-anchor="start">关键路径有没有继续追查</text>
<text x="34" y="207" font-size="19" fill="#2563b8" font-weight="400" text-anchor="start">只能核对已记录的调查</text>
<rect x="16" y="236" width="448" height="98" rx="16" fill="#f8faff" stroke="#d7e1ee" stroke-width="2"/>
<text x="34" y="265" font-size="23" fill="#172b46" font-weight="600" text-anchor="start">bug 检出率</text>
<text x="34" y="293" font-size="20" fill="#52647b" font-weight="400" text-anchor="start">真实问题到底发现了多少</text>
<text x="34" y="319" font-size="19" fill="#2563b8" font-weight="400" text-anchor="start">真实系统通常没有完整答案</text>
<text x="240" y="376" font-size="20" fill="#52647b" font-weight="400" text-anchor="middle">任务完成不代表关键路径和 bug 已查全</text>
</g></svg>
