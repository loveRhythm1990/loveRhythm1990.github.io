<svg xmlns="http://www.w3.org/2000/svg" width="480" height="432" viewBox="0 0 480 432">
<title>评测中的变量控制</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563b8"/></marker></defs>
<rect width="480" height="432" fill="#ffffff"/>
<g font-family="Heiti SC, Noto Sans CJK SC, sans-serif">
<text x="24" y="32" font-size="21" fill="#172b46" font-weight="600" text-anchor="start">固定代码、背景、模型、预算与验证条件</text>
<rect x="16" y="56" width="448" height="78" rx="16" fill="#f8faff" stroke="#d7e1ee" stroke-width="2"/>
<text x="36" y="86" font-size="23" fill="#172b46" font-weight="600" text-anchor="start">规则对照</text>
<text x="36" y="115" font-size="20" fill="#52647b" font-weight="400" text-anchor="start">不提供规则 / 提供项目规则</text>
<rect x="16" y="150" width="448" height="78" rx="16" fill="#f8faff" stroke="#d7e1ee" stroke-width="2"/>
<text x="36" y="180" font-size="23" fill="#172b46" font-weight="600" text-anchor="start">图检索对照</text>
<text x="36" y="209" font-size="20" fill="#52647b" font-weight="400" text-anchor="start">普通搜索 / 增加代码图查询</text>
<rect x="16" y="244" width="448" height="78" rx="16" fill="#f8faff" stroke="#d7e1ee" stroke-width="2"/>
<text x="36" y="274" font-size="23" fill="#172b46" font-weight="600" text-anchor="start">复核对照</text>
<text x="36" y="303" font-size="20" fill="#52647b" font-weight="400" text-anchor="start">关闭复核 / 开启复核</text>
<text x="24" y="368" font-size="21" fill="#2563b8" font-weight="400" text-anchor="start">记录召回、误报、执行范围与总成本</text>
<text x="24" y="408" font-size="20" fill="#52647b" font-weight="400" text-anchor="start">每组单独运行，只改变一个因素</text>
</g></svg>
