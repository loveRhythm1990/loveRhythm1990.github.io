<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="458" viewBox="0 0 1200 458">
<title>代码图的索引维护与审查查询</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563b8"/></marker></defs>
<rect width="1200" height="458" fill="#ffffff"/>
<g font-family="Heiti SC, Noto Sans CJK SC, sans-serif">
<text x="20" y="25" font-size="21" fill="#172b46" font-weight="600" text-anchor="start">索引维护 · 程序执行</text>
<rect x="20" y="42" width="220" height="70" rx="16" fill="#f8faff" stroke="#d7e1ee" stroke-width="2"/>
<text x="130.0" y="71" font-size="23" fill="#172b46" font-weight="600" text-anchor="middle">源码文件</text>
<text x="130.0" y="100" font-size="18" fill="#52647b" font-weight="400" text-anchor="middle">支持语言与忽略配置</text>
<rect x="320" y="42" width="260" height="70" rx="16" fill="#f8faff" stroke="#d7e1ee" stroke-width="2"/>
<text x="450.0" y="71" font-size="23" fill="#172b46" font-weight="600" text-anchor="middle">语法解析与关系解析</text>
<text x="450.0" y="100" font-size="18" fill="#52647b" font-weight="400" text-anchor="middle">定义、导入、引用与调用</text>
<rect x="660" y="42" width="220" height="70" rx="16" fill="#f8faff" stroke="#d7e1ee" stroke-width="2"/>
<text x="770.0" y="71" font-size="23" fill="#172b46" font-weight="600" text-anchor="middle">SQLite 图索引</text>
<text x="770.0" y="100" font-size="18" fill="#52647b" font-weight="400" text-anchor="middle">保存节点和关系</text>
<rect x="960" y="42" width="220" height="70" rx="16" fill="#f8faff" stroke="#d7e1ee" stroke-width="2"/>
<text x="1070.0" y="71" font-size="23" fill="#172b46" font-weight="600" text-anchor="middle">文件变化</text>
<text x="1070.0" y="100" font-size="18" fill="#52647b" font-weight="400" text-anchor="middle">按内容与依赖增量更新</text>
<path d="M248 77 L312 77" fill="none" stroke="#2563b8" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M588 77 L652 77" fill="none" stroke="#2563b8" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M960 77 H920 V140 H450 V118" fill="none" stroke="#2563b8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="680" y="134" font-size="18" fill="#2563b8" font-weight="400" text-anchor="middle">重算受影响关系</text>
<path d="M770 112 V172 H455 V212" fill="none" stroke="#ffffff" stroke-width="9"/>
<path d="M770 112 V172 H455 V212" fill="none" stroke="#2563b8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="20" y="195" font-size="21" fill="#172b46" font-weight="600" text-anchor="start">审查查询 · 宿主 agent 决定下一步</text>
<rect x="20" y="218" width="230" height="96" rx="16" fill="#ffffff" stroke="#d7e1ee" stroke-width="2"/>
<text x="135.0" y="248" font-size="24" fill="#172b46" font-weight="600" text-anchor="middle">1 识别改动</text>
<text x="135.0" y="279" font-size="18" fill="#52647b" font-weight="400" text-anchor="middle">diff 定位变更函数</text>
<text x="135.0" y="304" font-size="18" fill="#52647b" font-weight="400" text-anchor="middle">宿主确定调查范围</text>
<rect x="330" y="218" width="250" height="96" rx="16" fill="#ffffff" stroke="#d7e1ee" stroke-width="2"/>
<text x="455.0" y="248" font-size="24" fill="#172b46" font-weight="600" text-anchor="middle">2 图检索</text>
<text x="455.0" y="279" font-size="18" fill="#52647b" font-weight="400" text-anchor="middle">调用方、依赖与相关测试</text>
<text x="455.0" y="304" font-size="18" fill="#52647b" font-weight="400" text-anchor="middle">可选向量搜索定位入口</text>
<rect x="660" y="218" width="250" height="96" rx="16" fill="#ffffff" stroke="#d7e1ee" stroke-width="2"/>
<text x="785.0" y="248" font-size="24" fill="#172b46" font-weight="600" text-anchor="middle">3 补读源码</text>
<text x="785.0" y="279" font-size="18" fill="#52647b" font-weight="400" text-anchor="middle">宿主打开关键文件</text>
<text x="785.0" y="304" font-size="18" fill="#52647b" font-weight="400" text-anchor="middle">检查调用条件与断言</text>
<rect x="990" y="218" width="190" height="96" rx="16" fill="#ffffff" stroke="#d7e1ee" stroke-width="2"/>
<text x="1085.0" y="248" font-size="24" fill="#172b46" font-weight="600" text-anchor="middle">4 判断行为</text>
<text x="1085.0" y="279" font-size="18" fill="#52647b" font-weight="400" text-anchor="middle">宿主 LLM 判断</text>
<text x="1085.0" y="304" font-size="18" fill="#52647b" font-weight="400" text-anchor="middle">形成可核对的发现</text>
<path d="M258 266 L322 266" fill="none" stroke="#2563b8" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M588 266 L652 266" fill="none" stroke="#2563b8" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M918 266 L982 266" fill="none" stroke="#2563b8" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1085 314 V390 H455 V320" fill="none" stroke="#2563b8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="770" y="381" font-size="20" fill="#2563b8" font-weight="400" text-anchor="middle">证据不足：再次查询 / 补读</text>
<text x="600" y="436" font-size="19" fill="#52647b" font-weight="400" text-anchor="middle">图关系帮助找代码，向量相似度帮助找入口；缺陷判断仍需源码和行为证据</text>
</g></svg>
