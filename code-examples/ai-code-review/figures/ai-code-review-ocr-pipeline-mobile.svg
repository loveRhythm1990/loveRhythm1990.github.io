<svg xmlns="http://www.w3.org/2000/svg" width="480" height="446" viewBox="0 0 480 446">
<title>OCR 的六步执行过程</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563b8"/></marker></defs>
<rect width="480" height="446" fill="#ffffff"/>
<g font-family="Heiti SC, Noto Sans CJK SC, sans-serif">
<rect x="16" y="12" width="448" height="56" rx="16" fill="#f8faff" stroke="#d7e1ee" stroke-width="2"/>
<text x="32" y="36" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">1  文件选择</text>
<text x="448" y="35" font-size="17" fill="#2563b8" font-weight="400" text-anchor="end">程序</text>
<text x="32" y="59" font-size="17" fill="#52647b" font-weight="400" text-anchor="start">Git 差异与路径筛选 · 清单和排除理由</text>
<rect x="16" y="78" width="448" height="56" rx="16" fill="#f8faff" stroke="#d7e1ee" stroke-width="2"/>
<text x="32" y="102" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">2  规则匹配</text>
<text x="448" y="101" font-size="17" fill="#2563b8" font-weight="400" text-anchor="end">程序</text>
<text x="32" y="125" font-size="17" fill="#52647b" font-weight="400" text-anchor="start">按文件路径选要求 · 装入审查提示词</text>
<rect x="16" y="144" width="448" height="56" rx="16" fill="#f8faff" stroke="#d7e1ee" stroke-width="2"/>
<text x="32" y="168" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">3  文件分组</text>
<text x="448" y="167" font-size="17" fill="#2563b8" font-weight="400" text-anchor="end">模型 + 程序</text>
<text x="32" y="191" font-size="17" fill="#52647b" font-weight="400" text-anchor="start">模型只看文件元数据 · 程序校验与补齐</text>
<rect x="16" y="210" width="448" height="56" rx="16" fill="#f8faff" stroke="#d7e1ee" stroke-width="2"/>
<text x="32" y="234" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">4  任务调度</text>
<text x="448" y="233" font-size="17" fill="#2563b8" font-weight="400" text-anchor="end">程序</text>
<text x="32" y="257" font-size="17" fill="#52647b" font-weight="400" text-anchor="start">并发、预算和超时 · 各组独立上下文</text>
<rect x="16" y="276" width="448" height="56" rx="16" fill="#f8faff" stroke="#d7e1ee" stroke-width="2"/>
<text x="32" y="300" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">5  工具调查</text>
<text x="448" y="299" font-size="17" fill="#2563b8" font-weight="400" text-anchor="end">模型 + 程序</text>
<text x="32" y="323" font-size="17" fill="#52647b" font-weight="400" text-anchor="start">模型选择搜索和读取 · 工具结果回到模型</text>
<rect x="16" y="342" width="448" height="56" rx="16" fill="#f8faff" stroke="#d7e1ee" stroke-width="2"/>
<text x="32" y="366" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">6  评论处理</text>
<text x="448" y="365" font-size="17" fill="#2563b8" font-weight="400" text-anchor="end">模型 + 程序</text>
<text x="32" y="389" font-size="17" fill="#52647b" font-weight="400" text-anchor="start">定位、重定位与过滤 · 评论和执行状态</text>
<text x="240" y="429" font-size="19" fill="#52647b" font-weight="400" text-anchor="middle">辅助调用：计划、记忆压缩、评论重定位</text>
</g></svg>
