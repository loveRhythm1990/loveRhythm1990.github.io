<svg xmlns="http://www.w3.org/2000/svg" width="480" height="604" viewBox="0 0 480 604">
<title>OCR 的任务编排与两层反馈循环</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563b8"/></marker></defs>
<rect width="480" height="604" fill="#ffffff"/>
<g font-family="Heiti SC, Noto Sans CJK SC, sans-serif">
<rect x="16" y="12" width="448" height="72" rx="16" fill="#f8faff" stroke="#d7e1ee" stroke-width="2"/>
<text x="240" y="40" font-size="21" fill="#172b46" font-weight="600" text-anchor="middle">1 文件选择 → 2 规则准备</text>
<text x="240" y="69" font-size="21" fill="#172b46" font-weight="600" text-anchor="middle">→ 3 文件分组 → 4 并发调度</text>
<path d="M240 90 L240 110" fill="none" stroke="#2563b8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="16" y="118" width="448" height="378" rx="16" fill="#f9fbff" stroke="#d7e1ee" stroke-width="2"/>
<text x="240" y="146" font-size="21" fill="#172b46" font-weight="600" text-anchor="middle">每组独立上下文</text>
<text x="240" y="176" font-size="19" fill="#52647b" font-weight="400" text-anchor="middle">可选计划 → 本轮调查</text>
<rect x="40" y="206" width="180" height="80" rx="16" fill="#ffffff" stroke="#d7e1ee" stroke-width="2"/>
<rect x="270" y="206" width="170" height="80" rx="16" fill="#ffffff" stroke="#d7e1ee" stroke-width="2"/>
<text x="130" y="237" font-size="22" fill="#172b46" font-weight="600" text-anchor="middle">5 LLM 判断</text>
<text x="130" y="267" font-size="18" fill="#52647b" font-weight="400" text-anchor="middle">选择下一步动作</text>
<text x="355" y="237" font-size="22" fill="#172b46" font-weight="600" text-anchor="middle">执行工具</text>
<text x="355" y="267" font-size="17" fill="#52647b" font-weight="400" text-anchor="middle">搜索 · 读取 · 评论</text>
<path d="M226 246 L264 246" fill="none" stroke="#2563b8" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M355 286 V326 H130 V292" fill="none" stroke="#2563b8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="240" y="316" font-size="18" fill="#2563b8" font-weight="400" text-anchor="middle">结果追加到上下文</text>
<path d="M40 246 H26 V397 H34" fill="none" stroke="#2563b8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="240" y="353" font-size="18" fill="#52647b" font-weight="400" text-anchor="middle">task_done / 受限停止</text>
<rect x="40" y="364" width="400" height="66" rx="16" fill="#ffffff" stroke="#d7e1ee" stroke-width="2"/>
<text x="240" y="392" font-size="22" fill="#172b46" font-weight="600" text-anchor="middle">6 定位与过滤评论</text>
<text x="240" y="418" font-size="18" fill="#52647b" font-weight="400" text-anchor="middle">只处理候选评论，不执行复现</text>
<path d="M440 397 H454 V185 H130 V200" fill="none" stroke="#2563b8" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
<text x="240" y="462" font-size="19" fill="#2563b8" font-weight="400" text-anchor="middle">有新发现且未达限额：下一轮</text>
<text x="240" y="488" font-size="17" fill="#52647b" font-weight="400" text-anchor="middle">虚线返回模型，带入此前确认的发现</text>
<path d="M440 397 H472 V556 H446" fill="none" stroke="#2563b8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="526" width="400" height="60" rx="16" fill="#ffffff" stroke="#d7e1ee" stroke-width="2"/>
<text x="240" y="551" font-size="22" fill="#172b46" font-weight="600" text-anchor="middle">汇总各组报告</text>
<text x="240" y="576" font-size="17" fill="#52647b" font-weight="400" text-anchor="middle">评论、失败、未审内容与停止原因</text>
</g></svg>
