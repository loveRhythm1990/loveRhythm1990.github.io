<svg xmlns="http://www.w3.org/2000/svg" width="480" height="428" viewBox="0 0 480 428">
<title>从 diff 到审查结果</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563b8"/></marker></defs>
<rect width="480" height="428" fill="#ffffff"/>
<g font-family="Heiti SC, Noto Sans CJK SC, sans-serif">
<rect x="16" y="12" width="448" height="60" rx="16" fill="#ffffff" stroke="#d7e1ee" stroke-width="2"/>
<text x="34" y="37" font-size="20" fill="#2563b8" font-weight="600" text-anchor="start">1</text>
<text x="68" y="37" font-size="23" fill="#172b46" font-weight="600" text-anchor="start">确定范围</text>
<text x="68" y="61" font-size="18" fill="#52647b" font-weight="400" text-anchor="start">基准与目标 · 原始变更清单</text>
<path d="M240 76 L240 84" fill="none" stroke="#2563b8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="16" y="88" width="448" height="60" rx="16" fill="#ffffff" stroke="#d7e1ee" stroke-width="2"/>
<text x="34" y="113" font-size="20" fill="#2563b8" font-weight="600" text-anchor="start">2</text>
<text x="68" y="113" font-size="23" fill="#172b46" font-weight="600" text-anchor="start">准备输入</text>
<text x="68" y="137" font-size="18" fill="#52647b" font-weight="400" text-anchor="start">筛选与分组 · 预算与提示词</text>
<path d="M240 152 L240 160" fill="none" stroke="#2563b8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="16" y="164" width="448" height="60" rx="16" fill="#ffffff" stroke="#d7e1ee" stroke-width="2"/>
<text x="34" y="189" font-size="20" fill="#2563b8" font-weight="600" text-anchor="start">3</text>
<text x="68" y="189" font-size="23" fill="#172b46" font-weight="600" text-anchor="start">模型调查</text>
<text x="68" y="213" font-size="18" fill="#52647b" font-weight="400" text-anchor="start">提出候选问题 · 按需搜索和读文件</text>
<path d="M240 228 L240 236" fill="none" stroke="#2563b8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="16" y="240" width="448" height="60" rx="16" fill="#ffffff" stroke="#d7e1ee" stroke-width="2"/>
<text x="34" y="265" font-size="20" fill="#2563b8" font-weight="600" text-anchor="start">4</text>
<text x="68" y="265" font-size="23" fill="#172b46" font-weight="600" text-anchor="start">处理发现</text>
<text x="68" y="289" font-size="18" fill="#52647b" font-weight="400" text-anchor="start">定位与复核 · 可选行为验证</text>
<path d="M240 304 L240 312" fill="none" stroke="#2563b8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="16" y="316" width="448" height="60" rx="16" fill="#ffffff" stroke="#d7e1ee" stroke-width="2"/>
<text x="34" y="341" font-size="20" fill="#2563b8" font-weight="600" text-anchor="start">5</text>
<text x="68" y="341" font-size="23" fill="#172b46" font-weight="600" text-anchor="start">报告结果</text>
<text x="68" y="365" font-size="18" fill="#52647b" font-weight="400" text-anchor="start">评论与执行状态 · 未审内容及原因</text>
<text x="240" y="412" font-size="19" fill="#52647b" font-weight="400" text-anchor="middle">调查可多次调用工具，再继续判断</text>
</g></svg>
