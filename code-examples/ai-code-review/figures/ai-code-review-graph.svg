<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340">
<title>代码图与行为验证</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563b8"/></marker></defs>
<rect width="1000" height="340" fill="#ffffff"/>
<g font-family="Heiti SC, Noto Sans CJK SC, sans-serif">
<rect x="24" y="20" width="280" height="96" rx="16" fill="#f8faff" stroke="#d7e1ee" stroke-width="2"/>
<text x="164.0" y="54" font-size="23" fill="#172b46" font-weight="600" text-anchor="middle">test_own_order</text>
<text x="164.0" y="85" font-size="20" fill="#52647b" font-weight="400" text-anchor="middle">只验证自己的订单</text>
<path d="M312 68 L352 68" fill="none" stroke="#2563b8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="332" y="48" font-size="17" fill="#2563b8" font-weight="400" text-anchor="middle">调用</text>
<rect x="360" y="20" width="280" height="96" rx="16" fill="#f8faff" stroke="#d7e1ee" stroke-width="2"/>
<text x="500.0" y="54" font-size="23" fill="#172b46" font-weight="600" text-anchor="middle">get_order_handler</text>
<text x="500.0" y="85" font-size="20" fill="#52647b" font-weight="400" text-anchor="middle">返回前无归属校验</text>
<path d="M648 68 L688 68" fill="none" stroke="#2563b8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="668" y="48" font-size="17" fill="#2563b8" font-weight="400" text-anchor="middle">调用</text>
<rect x="696" y="20" width="280" height="96" rx="16" fill="#f8faff" stroke="#d7e1ee" stroke-width="2"/>
<text x="836.0" y="54" font-size="23" fill="#172b46" font-weight="600" text-anchor="middle">get_order</text>
<text x="836.0" y="85" font-size="20" fill="#52647b" font-weight="400" text-anchor="middle">租户过滤发生变化</text>
<text x="500" y="154" font-size="22" fill="#172b46" font-weight="600" text-anchor="middle">直接调用方相同，SQL 行为不同</text>
<rect x="24" y="178" width="460" height="96" rx="16" fill="#f3faf7" stroke="#c6dfd4" stroke-width="2"/>
<text x="48" y="214" font-size="22" fill="#116850" font-weight="600" text-anchor="start">正常 / 修复</text>
<text x="48" y="250" font-size="21" fill="#116850" font-weight="400" text-anchor="start">A 请求 B → 未找到</text>
<rect x="516" y="178" width="460" height="96" rx="16" fill="#fff7f6" stroke="#ebceca" stroke-width="2"/>
<text x="540" y="214" font-size="22" fill="#a33a32" font-weight="600" text-anchor="start">删除租户过滤</text>
<text x="540" y="250" font-size="21" fill="#a33a32" font-weight="400" text-anchor="start">A 请求 B → 返回 B 的订单</text>
<text x="500" y="320" font-size="19" fill="#52647b" font-weight="400" text-anchor="middle">调用关系不代表授权正确，测试关联不代表测试已执行</text>
</g></svg>
