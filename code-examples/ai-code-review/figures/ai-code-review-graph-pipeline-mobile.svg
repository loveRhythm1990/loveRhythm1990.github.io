<svg xmlns="http://www.w3.org/2000/svg" width="480" height="508" viewBox="0 0 480 508">
<title>代码图的索引维护与审查查询</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563b8"/></marker></defs>
<rect width="480" height="508" fill="#ffffff"/>
<g font-family="Heiti SC, Noto Sans CJK SC, sans-serif">
<rect x="16" y="12" width="448" height="78" rx="16" fill="#f8faff" stroke="#d7e1ee" stroke-width="2"/>
<text x="240" y="42" font-size="21" fill="#172b46" font-weight="600" text-anchor="middle">程序建图：源码 → 解析 → SQLite</text>
<text x="240" y="73" font-size="18" fill="#52647b" font-weight="400" text-anchor="middle">文件变化后增量维护关系索引</text>
<rect x="16" y="124" width="416" height="64" rx="16" fill="#ffffff" stroke="#d7e1ee" stroke-width="2"/>
<text x="36" y="151" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">1 识别改动</text>
<text x="36" y="176" font-size="18" fill="#52647b" font-weight="400" text-anchor="start">宿主根据 diff 确定调查范围</text>
<path d="M224 192 L224 198" fill="none" stroke="#2563b8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="16" y="202" width="416" height="64" rx="16" fill="#ffffff" stroke="#d7e1ee" stroke-width="2"/>
<text x="36" y="229" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">2 查询图索引</text>
<text x="36" y="254" font-size="18" fill="#52647b" font-weight="400" text-anchor="start">关系、影响范围、相关测试与片段</text>
<path d="M224 270 L224 276" fill="none" stroke="#2563b8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="16" y="280" width="416" height="64" rx="16" fill="#ffffff" stroke="#d7e1ee" stroke-width="2"/>
<text x="36" y="307" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">3 补读源码</text>
<text x="36" y="332" font-size="18" fill="#52647b" font-weight="400" text-anchor="start">宿主按需打开关键文件</text>
<path d="M224 348 L224 354" fill="none" stroke="#2563b8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="16" y="358" width="416" height="64" rx="16" fill="#ffffff" stroke="#d7e1ee" stroke-width="2"/>
<text x="36" y="385" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">4 判断行为</text>
<text x="36" y="410" font-size="18" fill="#52647b" font-weight="400" text-anchor="start">宿主 LLM 结合契约与证据判断</text>
<path d="M432 390 H456 V234 H438" fill="none" stroke="#2563b8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="240" y="457" font-size="20" fill="#2563b8" font-weight="400" text-anchor="middle">证据不足：继续查询或补读</text>
<text x="240" y="488" font-size="18" fill="#52647b" font-weight="400" text-anchor="middle">图工具供宿主调用，最终判断由宿主完成</text>
</g></svg>
