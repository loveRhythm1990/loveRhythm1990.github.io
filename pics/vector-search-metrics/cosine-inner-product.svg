<svg xmlns="http://www.w3.org/2000/svg" width="900" height="670" viewBox="0 0 900 670" role="img" aria-labelledby="title desc">
<title id="title">Cosine 与 Inner Product · 夹角和投影</title><desc id="desc">q=(4,0)，x=(3,4)。等比例坐标，模长为4和5。x在查询方向上的有符号投影为3，cosine=0.6，内积=12。</desc>
<defs>
<marker id="blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#2563eb"/></marker>
<marker id="teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#087f8c"/></marker>
<marker id="pink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#b43d6a"/></marker>
<marker id="ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#172b45"/></marker>
<marker id="gold" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#b7790a"/></marker>
</defs>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
<rect x="1" y="1" width="898" height="668" rx="24" fill="#f6f9fd" stroke="#dce5ef"/>
<rect x="28" y="28" width="6" height="56" rx="3" fill="#2563eb" stroke="#2563eb"/>
<text x="52" y="56" font-size="29" fill="#172b45" font-weight="700" text-anchor="start">Cosine 与 Inner Product · 夹角和投影</text>
<text x="52" y="89" font-size="21" fill="#50647d" font-weight="400" text-anchor="start">同一夹角：cosine 只看方向，内积还保留向量长度。</text>
<rect x="28" y="116" width="844" height="411" rx="16" fill="#fff" stroke="#dce5ef"/>
<line x1="165" y1="456" x2="165" y2="150.5" stroke="#edf2f7" stroke-width="2" stroke-linecap="round"/>
<line x1="100" y1="391" x2="438.0" y2="391" stroke="#edf2f7" stroke-width="2" stroke-linecap="round"/>
<line x1="230" y1="456" x2="230" y2="150.5" stroke="#edf2f7" stroke-width="2" stroke-linecap="round"/>
<line x1="100" y1="326" x2="438.0" y2="326" stroke="#edf2f7" stroke-width="2" stroke-linecap="round"/>
<line x1="295" y1="456" x2="295" y2="150.5" stroke="#edf2f7" stroke-width="2" stroke-linecap="round"/>
<line x1="100" y1="261" x2="438.0" y2="261" stroke="#edf2f7" stroke-width="2" stroke-linecap="round"/>
<line x1="360" y1="456" x2="360" y2="150.5" stroke="#edf2f7" stroke-width="2" stroke-linecap="round"/>
<line x1="100" y1="196" x2="438.0" y2="196" stroke="#edf2f7" stroke-width="2" stroke-linecap="round"/>
<line x1="425" y1="456" x2="425" y2="150.5" stroke="#edf2f7" stroke-width="2" stroke-linecap="round"/>
<line x1="100" y1="456" x2="450" y2="456" stroke="#50647d" stroke-width="2" stroke-linecap="round"/>
<line x1="100" y1="456" x2="100" y2="144" stroke="#50647d" stroke-width="2" stroke-linecap="round"/>
<text x="75" y="484" font-size="18" fill="#50647d" font-weight="400" text-anchor="start">O</text>
<text x="295" y="485" font-size="18" fill="#50647d" font-weight="400" text-anchor="middle">3</text>
<text x="360" y="485" font-size="18" fill="#50647d" font-weight="400" text-anchor="middle">4</text>
<line x1="100" y1="456" x2="360" y2="456" stroke="#2563eb" stroke-width="5" stroke-linecap="round" marker-end="url(#blue)"/>
<line x1="100" y1="456" x2="295" y2="196" stroke="#087f8c" stroke-width="5" stroke-linecap="round" marker-end="url(#teal)"/>
<line x1="295" y1="196" x2="295" y2="456" stroke="#b43d6a" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/>
<path d="M 282 456 L 282 443 L 295 443" fill="none" stroke="#b43d6a" stroke-width="2"/>
<path d="M 167 456 A 67 67 0 0 0 140.2 402.4" fill="none" stroke="#b7790a" stroke-width="3"/>
<text x="172" y="421" font-size="24" fill="#b7790a" font-weight="700" text-anchor="start">θ</text>
<text x="310" y="184" font-size="23" fill="#087f8c" font-weight="600" text-anchor="start">x = (3, 4)</text>
<text x="370" y="442" font-size="22" fill="#2563eb" font-weight="600" text-anchor="start">q = (4, 0)</text>
<line x1="100" y1="519" x2="295" y2="519" stroke="#b43d6a" stroke-width="3" stroke-linecap="round"/>
<line x1="100" y1="513" x2="100" y2="525" stroke="#b43d6a" stroke-width="2" stroke-linecap="round"/>
<line x1="295" y1="513" x2="295" y2="525" stroke="#b43d6a" stroke-width="2" stroke-linecap="round"/>
<text x="197.5" y="511" font-size="20" fill="#b43d6a" font-weight="400" text-anchor="middle">投影长度 = 3</text>
<rect x="526" y="179" width="309" height="270" rx="16" fill="#f6f9fd" stroke="#dce5ef"/>
<text x="549" y="216" font-size="23" fill="#172b45" font-weight="600" text-anchor="start">‖q‖ = 4，‖x‖ = 5</text>
<text x="549" y="257" font-size="23" fill="#b7790a" font-weight="600" text-anchor="start">θ ≈ 53.13°</text>
<line x1="549" y1="280" x2="810" y2="280" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
<text x="549" y="316" font-size="22" fill="#2563eb" font-weight="600" text-anchor="start">cos θ = 3 / 5 = 0.6</text>
<text x="549" y="353" font-size="22" fill="#087f8c" font-weight="600" text-anchor="start">q · x = 4 × 3 = 12</text>
<text x="549" y="407" font-size="20" fill="#50647d" font-weight="400" text-anchor="start">x 加倍：cos 不变，IP 加倍</text>
<rect x="28" y="547" width="844" height="91" rx="16" fill="#e9f7f6" stroke="#cceae6"/>
<text x="50" y="583" font-size="27" fill="#087f8c" font-weight="600" text-anchor="start">q · x = ‖q‖ ‖x‖ cos θ</text>
<text x="50" y="615" font-size="21" fill="#50647d" font-weight="400" text-anchor="start">内积 = 查询长度 × 文档在查询方向上的有符号投影。</text>
</g>
</svg>
