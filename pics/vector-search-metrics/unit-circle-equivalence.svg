<svg xmlns="http://www.w3.org/2000/svg" width="900" height="710" viewBox="0 0 900 710" role="img" aria-labelledby="title desc">
<title id="title">单位圆 · 夹角、内积与弦长</title><desc id="desc">等比例单位圆，q帽=(1,0)，x帽=(0.6,0.8)。夹角53.13度，cosine与IP均为0.6，连接两终点的弦长平方为0.8，弦长约0.8944。</desc>
<defs>
<marker id="blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#2563eb"/></marker>
<marker id="teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#087f8c"/></marker>
<marker id="pink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#b43d6a"/></marker>
<marker id="ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#172b45"/></marker>
<marker id="gold" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#b7790a"/></marker>
</defs>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
<rect x="1" y="1" width="898" height="708" rx="24" fill="#f6f9fd" stroke="#dce5ef"/>
<rect x="28" y="28" width="6" height="56" rx="3" fill="#2563eb" stroke="#2563eb"/>
<text x="52" y="56" font-size="29" fill="#172b45" font-weight="700" text-anchor="start">单位圆 · 夹角、内积与弦长</text>
<text x="52" y="89" font-size="21" fill="#50647d" font-weight="400" text-anchor="start">cosine 越大，内积越大，终点之间的弦越短。</text>
<rect x="28" y="116" width="844" height="452" rx="16" fill="#fff" stroke="#dce5ef"/>
<circle cx="274" cy="349" r="174" fill="none" stroke="#bbcee6" stroke-width="3"/>
<line x1="73" y1="349" x2="479" y2="349" stroke="#50647d" stroke-width="2" stroke-linecap="round"/>
<line x1="274" y1="545" x2="274" y2="152" stroke="#50647d" stroke-width="2" stroke-linecap="round"/>
<text x="251" y="377" font-size="18" fill="#50647d" font-weight="400" text-anchor="start">O</text>
<text x="448" y="379" font-size="18" fill="#50647d" font-weight="400" text-anchor="middle">1</text>
<text x="250" y="181" font-size="18" fill="#50647d" font-weight="400" text-anchor="start">1</text>
<path d="M 274 349 L 448 349 A 174 174 0 0 0 378.4 209.79999999999998 Z" fill="#eaf1fe" stroke="#eaf1fe" stroke-width="0"/>
<line x1="274" y1="349" x2="448" y2="349" stroke="#2563eb" stroke-width="4" stroke-linecap="round" marker-end="url(#blue)"/>
<line x1="274" y1="349" x2="378.4" y2="209.79999999999998" stroke="#087f8c" stroke-width="4" stroke-linecap="round" marker-end="url(#teal)"/>
<line x1="448" y1="349" x2="378.4" y2="209.79999999999998" stroke="#b43d6a" stroke-width="5" stroke-linecap="round"/>
<circle cx="448" cy="349" r="5" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
<circle cx="378.4" cy="209.79999999999998" r="5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/>
<path d="M 335 349 A 61 61 0 0 0 310.6 300.2" fill="none" stroke="#b7790a" stroke-width="3"/>
<text x="338" y="323" font-size="25" fill="#b7790a" font-weight="700" text-anchor="start">θ</text>
<text x="463" y="356" font-size="21" fill="#2563eb" font-weight="600" text-anchor="start">q̂ = (1, 0)</text>
<text x="370.4" y="189.79999999999998" font-size="21" fill="#087f8c" font-weight="600" text-anchor="middle">x̂ = (0.6, 0.8)</text>
<text x="248" y="491" font-size="22" fill="#50647d" font-weight="400" text-anchor="start">‖q̂‖ = ‖x̂‖ = 1</text>
<rect x="563" y="163" width="280" height="263" rx="16" fill="#fff5f8" stroke="#f2d5e0"/>
<text x="585" y="201" font-size="22" fill="#b43d6a" font-weight="700" text-anchor="start">同一个夹角</text>
<text x="585" y="239" font-size="22" fill="#b7790a" font-weight="600" text-anchor="start">θ ≈ 53.13°</text>
<text x="585" y="279" font-size="21" fill="#087f8c" font-weight="600" text-anchor="start">cos θ = q̂ · x̂ = 0.6</text>
<text x="585" y="322" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">弦长² = 2 − 2 × 0.6</text>
<text x="585" y="358" font-size="22" fill="#b43d6a" font-weight="600" text-anchor="start">           = 0.8</text>
<text x="585" y="398" font-size="22" fill="#b43d6a" font-weight="600" text-anchor="start">弦长 ≈ 0.8944</text>
<rect x="28" y="588" width="844" height="93" rx="16" fill="#eaf1fe" stroke="#d6e3ff"/>
<text x="50" y="625" font-size="28" fill="#2563eb" font-weight="600" text-anchor="start">‖q̂ − x̂‖² = 2 − 2 cos θ</text>
<text x="50" y="658" font-size="21" fill="#50647d" font-weight="400" text-anchor="start">最大 cosine ⇔ 最大 IP ⇔ 最小 L2（单位向量、精确计算）。</text>
</g>
</svg>
