<svg xmlns="http://www.w3.org/2000/svg" width="900" height="780" viewBox="0 0 900 780" role="img" aria-labelledby="title desc">
<title id="title">归一化 · 去掉长度，保留方向</title><desc id="desc">左侧等比例原始坐标中q=(1,0)，A=(0.8,0.1)，B=(10,0)，C=(20,5)。右侧为单位圆第一象限及等比例局部放大图，B与q重合，A与C保持原方向。</desc>
